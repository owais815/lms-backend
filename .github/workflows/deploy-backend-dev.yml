name: Deploy Backend (dev) to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            DEPLOY_DIR=/var/www/lms-backend-dev

            # ── Ensure deploy dir exists and is a git repo ───────────────────
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone ${{ secrets.LMS_REPO_URL }} "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # ── Write .env from GitHub Secrets ───────────────────────────────
            cat > .env << 'ENVEOF'
            NODE_ENV=development

            # JWT
            JWT_SECRET=${{ secrets.JWT_SECRET }}

            # Database (separate dev DB)
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME_DEV }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            # CORS
            CORS_ORIGIN_DEV=${{ secrets.CORS_ORIGIN_DEV }}
            CORS_ORIGIN_PROD=${{ secrets.CORS_ORIGIN_PROD }}

            # Port (plain HTTP — no SSL on dev)
            HTTP_PORT=8082

            # Admin creation
            ALLOW_AUTO_ADMIN_CREATION=false

            # Calling App (MiroTalk SFU — dev instance)
            CALLING_APP_URL=${{ secrets.CALLING_APP_URL_DEV }}
            CALLING_APP_API_URL=${{ secrets.CALLING_APP_API_URL_DEV }}
            CALLING_APP_API_SECRET=${{ secrets.CALLING_APP_API_SECRET }}
            LMS_API_URL=${{ secrets.LMS_API_URL_DEV }}

            # ── Email subsystem ──────────────────────────────────────────────
            # SMTP credentials live here and NOT in the database. Point dev at a
            # catch-all mailbox or a Mailpit instance, never at the real relay.
            SMTP_HOST=${{ secrets.SMTP_HOST_DEV }}
            SMTP_PORT=${{ secrets.SMTP_PORT_DEV }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE_DEV }}
            SMTP_USER=${{ secrets.SMTP_USER_DEV }}
            SMTP_PASS=${{ secrets.SMTP_PASS_DEV }}

            EMAIL_FROM_NAME=${{ secrets.EMAIL_FROM_NAME }}
            EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}
            EMAIL_APP_BASE_URL=${{ secrets.EMAIL_APP_BASE_URL_DEV }}
            APP_NAME=${{ secrets.APP_NAME }}
            ADMIN_ALERT_EMAILS=${{ secrets.ADMIN_ALERT_EMAILS_DEV }}

            # Dev defaults to sandbox so real addresses in a copied database can
            # never be mailed by accident -- everything lands in EMAIL_SANDBOX_TO.
            EMAIL_ENABLED=true
            EMAIL_MODE=sandbox
            EMAIL_SANDBOX_TO=${{ secrets.EMAIL_SANDBOX_TO }}
            EMAIL_CONCURRENCY=2
            EMAIL_MAX_PER_MINUTE=30
            EMAIL_WORKER_EMBEDDED=false

            REDIS_URL=${{ secrets.REDIS_URL_DEV }}
            DB_POOL_MAX=10
            ENVEOF

            # ── Pull latest dev branch ───────────────────────────────────────
            git fetch origin
            git reset --hard origin/dev

            # ── Install/update dependencies ──────────────────────────────────
            # Use pnpm + the committed lockfile: pinned, reproducible versions,
            # and postinstall scripts are blocked unless explicitly allowlisted
            # (npm install with no lockfile re-resolves everything from the
            # registry on every deploy and runs every postinstall unrestricted).
            command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
            pnpm install --prod --frozen-lockfile

            # ── Restart with PM2 ─────────────────────────────────────────────
            # Kept as explicit app names rather than ecosystem.config.js, because
            # the dev and prod instances share this box and the ecosystem file
            # declares the production app names.
            DEV_ENV="NODE_ENV=development HTTP_PORT=8082 DB_USER=${{ secrets.DB_USER }} DB_PASSWORD=${{ secrets.DB_PASSWORD }} DB_NAME=${{ secrets.DB_NAME_DEV }} DB_HOST=${{ secrets.DB_HOST }}"

            if pm2 list | grep -q "lms-backend-dev"; then
              env $DEV_ENV pm2 restart lms-backend-dev --update-env
            else
              env $DEV_ENV pm2 start app.js --name lms-backend-dev
            fi

            # Email worker. kill_timeout gives the drain time to finish; without
            # it PM2 SIGKILLs after 1600ms. Jobs are lease-protected either way,
            # so a hard kill costs latency rather than correctness.
            if pm2 list | grep -q "lms-email-worker-dev"; then
              env $DEV_ENV DB_POOL_MAX=6 pm2 restart lms-email-worker-dev --update-env
            else
              env $DEV_ENV DB_POOL_MAX=6 pm2 start worker.js --name lms-email-worker-dev --kill-timeout 30000
            fi

            pm2 save

            # ── Verify ───────────────────────────────────────────────────────
            pm2 status
            pm2 logs lms-backend-dev --lines 20 --nostream
