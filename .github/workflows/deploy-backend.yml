name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/lms-backend

            # ── Write .env from GitHub Secrets ──────────────────────────────
            cat > .env << 'ENVEOF'
            NODE_ENV=production

            # JWT
            JWT_SECRET=${{ secrets.JWT_SECRET }}

            # Database
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_USER_PROD=${{ secrets.DB_USER_PROD }}
            DB_PASSWORD_PROD=${{ secrets.DB_PASSWORD_PROD }}

            # CORS
            CORS_ORIGIN_DEV=${{ secrets.CORS_ORIGIN_DEV }}
            CORS_ORIGIN_PROD=${{ secrets.CORS_ORIGIN_PROD }}

            # SSL certificate paths
            SSL_KEY_PATH=${{ secrets.SSL_KEY_PATH }}
            SSL_CERT_PATH=${{ secrets.SSL_CERT_PATH }}

            # Ports
            HTTP_PORT=${{ secrets.HTTP_PORT }}
            HTTPS_PORT=${{ secrets.HTTPS_PORT }}

            # Admin creation (disable in production)
            ALLOW_AUTO_ADMIN_CREATION=false

            # Calling App (MiroTalk SFU)
            CALLING_APP_URL=${{ secrets.CALLING_APP_URL }}
            CALLING_APP_API_URL=${{ secrets.CALLING_APP_API_URL }}
            CALLING_APP_API_SECRET=${{ secrets.CALLING_APP_API_SECRET }}
            LMS_API_URL=${{ secrets.LMS_API_URL }}

            # ── Email subsystem ──────────────────────────────────────────────
            # SMTP credentials live here and NOT in the database: the DB is
            # dumped for backups, and keeping the whole tuple in env means one
            # rotation point (GitHub Secrets -> .env -> pm2 restart).
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_ALLOWED_FROM_DOMAINS=${{ secrets.SMTP_ALLOWED_FROM_DOMAINS }}

            # Sender identity and branding defaults. Admins can override most of
            # these at runtime in Settings -> Email Notifications.
            EMAIL_FROM_NAME=${{ secrets.EMAIL_FROM_NAME }}
            EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}
            EMAIL_REPLY_TO=${{ secrets.EMAIL_REPLY_TO }}
            EMAIL_APP_BASE_URL=${{ secrets.EMAIL_APP_BASE_URL }}
            APP_NAME=${{ secrets.APP_NAME }}
            APP_LOGO_URL=${{ secrets.APP_LOGO_URL }}
            SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}

            # Admin alert recipients, in addition to admins with an address on
            # their profile. Comma separated.
            ADMIN_ALERT_EMAILS=${{ secrets.ADMIN_ALERT_EMAILS }}

            # Sending behaviour. EMAIL_MODE stays 'log' until someone
            # deliberately switches it to live -- see docs/EMAIL.md.
            EMAIL_ENABLED=true
            EMAIL_MODE=log
            EMAIL_SANDBOX_TO=${{ secrets.EMAIL_SANDBOX_TO }}
            EMAIL_TIMEZONE=${{ secrets.EMAIL_TIMEZONE }}
            EMAIL_CURRENCY=${{ secrets.EMAIL_CURRENCY }}
            EMAIL_CONCURRENCY=3
            EMAIL_MAX_PER_MINUTE=60
            EMAIL_MAX_ENQUEUE_PER_DISPATCH=200
            EMAIL_MAX_SENDS_PER_HOUR=500
            EMAIL_WORKER_EMBEDDED=false

            # Leave REDIS_URL empty to use the MySQL queue driver. Setting it
            # switches the queue to BullMQ with no other change.
            REDIS_URL=${{ secrets.REDIS_URL }}

            # Connection pool. The API and the worker are separate processes
            # sharing one database, so each gets its own ceiling.
            DB_POOL_MAX=15
            ENVEOF

            # ── Pull latest code (force-reset to avoid merge conflicts) ────────
            git fetch origin
            git reset --hard origin/main

            # ── Install/update dependencies ──────────────────────────────────
            # Use pnpm + the committed lockfile: pinned, reproducible versions,
            # and postinstall scripts are blocked unless explicitly allowlisted
            # (npm install with no lockfile re-resolves everything from the
            # registry on every deploy and runs every postinstall unrestricted).
            command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
            pnpm install --prod --frozen-lockfile

            # ── Restart with PM2 ─────────────────────────────────────────────
            # ecosystem.config.js defines BOTH the API and the email worker, and
            # sets kill_timeout: 30000 -- PM2's 1600ms default would SIGKILL the
            # worker mid-drain and make its graceful shutdown decorative.
            NODE_ENV=production             DB_USER=${{ secrets.DB_USER_PROD }}             DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}             DB_NAME=${{ secrets.DB_NAME }}             DB_HOST=${{ secrets.DB_HOST }}               pm2 startOrReload ecosystem.config.js --update-env

            pm2 save

            # ── Verify ───────────────────────────────────────────────────────
            pm2 status
            pm2 logs lms-backend --lines 20 --nostream
